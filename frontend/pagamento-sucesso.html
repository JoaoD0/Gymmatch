<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>GymMatch — Assinatura confirmada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="css/pagamento-sucesso.css" />

<body>
    <div class="sucesso-container" id="sucesso-container">
        <p class="subtitle">Confirmando assinatura...</p>

    <script src="js/api.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/pagamento-sucesso.js"></script>
    <span id="fim-da-pagina" hidden></span>

</html>
