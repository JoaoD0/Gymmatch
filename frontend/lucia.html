<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>GymMatch — Lucia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/lucia.css" />
    <!-- pinta a página nova só depois dos scripts do fim do body (a barra precisa já estar desenhada para a transição) -->
    <link rel="expect" href="#fim-da-pagina" blocking="render" />
    <script src="js/transicoes.js"></script>
</head>
<body class="lucia-body">
    <div class="lucia-tela">
        <header class="lucia-cabecalho">
            <button type="button" class="lucia-icone-btn" id="lucia-voltar" aria-label="Voltar"></button>
            <div id="lucia-avatar-topo"></div>
            <div class="lucia-cabecalho-info">
                <div class="lucia-nome-linha">
                    <p class="lucia-nome">Lucia</p>
                    <span class="lucia-tag">assistente</span>
                </div>
                <div class="lucia-status" id="lucia-status">
                    <span class="lucia-status-ponto"></span>
                    <span class="lucia-status-texto">online agora</span>
                </div>
            </div>
            <button type="button" class="lucia-icone-btn lucia-limpar" id="lucia-limpar" aria-label="Limpar conversa"></button>
        </header>

        <div class="lucia-faixa-notif" id="lucia-faixa-notif" hidden></div>

        <div class="lucia-mensagens" id="lucia-mensagens" aria-live="polite"></div>

        <div class="lucia-atalhos" id="lucia-atalhos"></div>

        <div class="lucia-envio">
            <div class="lucia-campo">
                <input type="text" id="lucia-input" maxlength="500" placeholder="Escreva para a Lucia..." autocomplete="off" />
                <span class="lucia-contador" id="lucia-contador" hidden></span>
            </div>
            <button type="button" class="lucia-enviar" id="lucia-enviar" aria-label="Enviar" disabled></button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>exigirLogin();</script>
    <script src="js/icons.js"></script>
    <script src="js/notificacoes.js"></script>
    <script src="js/lucia.js"></script>
    <script src="js/lucia-chat.js"></script>
    <span id="fim-da-pagina" hidden></span>
</body>
</html>
