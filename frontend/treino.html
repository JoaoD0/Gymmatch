<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>GymMatch — Treino</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/treino.css" />
    <link rel="stylesheet" href="css/match-overlay.css" />
    <link rel="stylesheet" href="css/lucia.css" />
    <!-- pinta a página nova só depois dos scripts do fim do body (a barra precisa já estar desenhada para a transição) -->
    <link rel="expect" href="#fim-da-pagina" blocking="render" />
    <script src="js/transicoes.js"></script>
</head>
<body class="treino-body">
    <header class="treino-header">
        <div class="treino-header-inner" id="treino-header">
            <div class="treino-skel" style="width:80px;height:32px"></div>
            <div class="treino-skel" style="width:96px;height:32px;border-radius:8px"></div>
        </div>
    </header>

    <main class="treino-main" id="treino-main">
        <div id="treino-carregando">
            <div class="treino-skel" style="width:112px;height:12px;margin-bottom:16px"></div>
            <div class="treino-skel-card">
                <div class="treino-skel-linha"><div class="treino-skel" style="width:32px"></div><div class="treino-skel" style="width:50%"></div></div>
                <div class="treino-skel-linha"><div class="treino-skel" style="width:32px"></div><div class="treino-skel" style="width:75%"></div></div>
                <div class="treino-skel-linha"><div class="treino-skel" style="width:32px"></div><div class="treino-skel" style="width:66%"></div></div>
                <div class="treino-skel-linha"><div class="treino-skel" style="width:32px"></div><div class="treino-skel" style="width:33%"></div></div>
                <div class="treino-skel-linha"><div class="treino-skel" style="width:32px"></div><div class="treino-skel" style="width:60%"></div></div>
                <div class="treino-skel-linha"><div class="treino-skel" style="width:32px"></div><div class="treino-skel" style="width:40%"></div></div>
                <div class="treino-skel-linha"><div class="treino-skel" style="width:32px"></div><div class="treino-skel" style="width:50%"></div></div>
            </div>
        </div>

        <div class="treino-secoes" id="treino-secoes" hidden>
            <section id="sec-checkin"></section>
            <section id="sec-grupos"></section>
            <section id="sec-desafios"></section>
            <section id="sec-convites"></section>
            <section id="sec-plano"></section>
            <section id="sec-exercicios"></section>
            <section id="sec-marcados"></section>
        </div>
    </main>

    <nav id="bottom-nav"></nav>

    <script src="js/api.js"></script>
    <script>exigirLogin();</script>
    <script src="js/icons.js"></script>
    <script src="js/notificacoes.js"></script>
    <script src="js/lucia.js"></script>
    <script src="js/sheet.js"></script>
    <script src="js/match-overlay.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/treino.js"></script>
    <span id="fim-da-pagina" hidden></span>
</body>
</html>
