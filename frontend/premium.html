<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>GymMatch — Planos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/premium.css" />
    <!-- pinta a página nova só depois dos scripts do fim do body (a barra precisa já estar desenhada para a transição) -->
    <link rel="expect" href="#fim-da-pagina" blocking="render" />
    <script src="js/transicoes.js"></script>
</head>
<body>
    <div class="container">
        <a href="perfil.html" class="premium-back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            Voltar
        </a>
        <h1 class="premium-title">Sem limites.</h1>
        <p class="premium-plano-atual" id="premium-plano-atual"></p>

        <div class="premium-selector" id="premium-selector">
            <button type="button" data-plano="gratis">Grátis</button>
            <button type="button" data-plano="gold">Gold</button>
            <button type="button" data-plano="diamond">Diamond</button>
        </div>

        <div id="premium-detalhe"><p class="subtitle">Carregando...</p></div>

        <p class="premium-rodape">Cancele quando quiser · Pagamento simulado (projeto acadêmico)</p>
    </div>

    <script src="js/api.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/sheet.js"></script>
    <script src="js/premium.js"></script>
    <span id="fim-da-pagina" hidden></span>
</body>
</html>
