<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>GymMatch — Descobrir</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/discover.css" />
    <link rel="stylesheet" href="css/upgrade-modal.css" />
    <link rel="stylesheet" href="css/match-overlay.css" />
    <link rel="stylesheet" href="css/lucia.css" />
    <!-- pinta a página nova só depois dos scripts do fim do body (a barra precisa já estar desenhada para a transição) -->
    <link rel="expect" href="#fim-da-pagina" blocking="render" />
    <script src="js/transicoes.js"></script>
</head>
<body>
    <div class="container discover-page">
        <div class="discover-header">
            <h1>Descobrir</h1>
            <button class="icon-btn" id="btn-logout" aria-label="Sair" title="Sair">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
        </div>

        <div id="deck"></div>

        <div class="swipe-actions">
            <button class="round-btn round-btn-secondary" id="btn-pass" aria-label="Passar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <button class="round-btn round-btn-secondary round-btn-small" id="btn-undo" aria-label="Desfazer" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            </button>
            <button class="round-btn round-btn-primary" id="btn-like" aria-label="Curtir">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 21s-6.7-4.35-9.33-8.2C.9 10.1 1.4 6.6 4.2 4.9c2.3-1.4 5-1 6.8 1.1L12 7l1-1c1.8-2.1 4.5-2.5 6.8-1.1 2.8 1.7 3.3 5.2 1.53 7.9C18.7 16.65 12 21 12 21z"/></svg>
            </button>
        </div>

        <p class="error" id="erro"></p>
    </div>

    <nav id="bottom-nav"></nav>

    <script src="js/api.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/notificacoes.js"></script>
    <script src="js/lucia.js"></script>
    <script src="js/sheet.js"></script>
    <script src="js/upgrade-modal.js"></script>
    <script src="js/match-overlay.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/discover.js"></script>
    <span id="fim-da-pagina" hidden></span>
</body>
</html>
